<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Part</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">

</head>

<body>
    <div class="container" >
        
                <div class="form-box register" id="registerform">
            <form action="">
                <img src="logo.png" alt="Site logo" class="site-logo">
                <h1>Register</h1>
                <div class="input-box">
                    <p>E-mail Id:</p>
                    <input type="email" placeholder="college e-mail id" required>
                </div>
                <div class="input-box">
                    <p>Create Password:</p>
                    <input type="password" placeholder="Create Password" required>
                </div>
                <div class="input-box">
                    <p>Confirm Password:</p>
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Register</button>
                
                
            </form>
        </div>
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello new user!</h1>
                <p>already had an account?</p>
                <a href="studentlogin.html" class="btn login-btn">Login Now</a>
            </div>
        </div>
    </div>
</body>
</html>
