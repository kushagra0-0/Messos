<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Part</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">

</head>

<body>
    <div class="container" >
    
        <div class="form-box login" id="loginform">
            <form action="">
                <img src="logo.png" alt="Site logo" class="site-logo">
                <h1>Login</h1>
                <div class="input-box">
                    <p>E-mail Id:</p>
                    <input type="email" placeholder="college e-mail id" required>
                </div>
                <div class="input-box">
                    <p>Password:</p>
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <a href="page.html" class="btn register-btn">Login</a>
                
            </form>
        </div>
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Welcome Back!</h1>
                <p>Don't have an account?</p>
                <a href="studentregister.html" class="btn register-btn">Register Now</a>
            </div>
        </div>
       
        
    </div>
</body>
</html>
